[profile]
# Source2Reel is generic. This profile is Dennis Hilk's current series default.
name = "dennis-explainer"
theme = "dennis-dark"
voice = "dennis-explainer"
series_label = "DENNIS EXPLAINER"

[llm]
# One replaceable local multimodal server is the first baseline. A current
# llama.cpp server can expose an OpenAI-compatible API on localhost.
provider = "openai_compat"
base_url = "http://127.0.0.1:8080/v1"
model = "qwen3-vl-8b-instruct"
temperature = 0.10
timeout = 600

[local_ai]
# Override in ignored config/local.toml, or use DENNIS_LLM_MODEL /
# DENNIS_LLM_MMPROJ. A single models/*.gguf is also discovered automatically.
model_path = ""
mmproj_path = ""
context_size = 32768

[vision]
enabled = true
max_items = 40
# Vision currently reuses the configured LLM provider. It may be split into a
# second provider later without changing episode files.

[research]
# Legacy/hard batching ceiling. The context-safe splitter may choose smaller
# requests automatically from local_ai.context_size.
batch_chars = 45000

[chunking]
# Keep enough room for structured model output and tokenizer-estimation error.
output_reserve_tokens = 4096
safety_tokens = 1024
max_retries = 2
max_reduce_levels = 4

[ingest]
max_web_pages = 12

[policy]
video_language = "en"
working_language = "de"
require_evidence_refs = true
prefer_authentic_media = true
static_evidence = true
