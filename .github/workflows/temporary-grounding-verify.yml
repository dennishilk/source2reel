name: Temporary grounding verification

on:
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - run: uv sync --python 3.12
      - run: uv pip install pytest
      - run: env PYTHONPATH=. uv run pytest -q tests
