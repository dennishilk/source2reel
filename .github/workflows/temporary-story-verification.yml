name: Temporary Source2Reel story verification
on:
  push:
    branches: [agent/requested-story-quality]
jobs:
  portable-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install uv
      - run: env PYTHONPATH=. uv run --with pytest pytest -q tests -k "not repository_launcher_uses_local_interpreter"
