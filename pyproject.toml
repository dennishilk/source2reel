[project]
name = "source2reel"
version = "0.2.0"
description = "Local, evidence-first AI-assisted technical explainer production engine"
requires-python = ">=3.12,<3.13"
dependencies = [
  "kokoro==0.9.4",
  "soundfile==0.13.1",
  "numpy>=2.0,<3",
  "pillow>=11,<13",
]

[project.scripts]
source2reel = "source2reel.cli:main"

[tool.uv]
package = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["source2reel"]
